
# ==============================================================================
# API CONFIGURATION
# ==============================================================================

api.host=https://clob.polymarket.com
chain.id=137
secret.key.file=secret-key.txt
funder.wallet.file=funder-wallet.txt

# ==============================================================================
# PERFORMANCE TUNING
# ==============================================================================

# HTTP client settings
http.connection.pool.size=50
http.connection.timeout=5000
http.read.timeout=10000
http.write.timeout=10000
http.keep.alive.duration=300

# Threading
thread.pool.size=10
scheduled.pool.size=2
credentials.signature-type=1
# ==============================================================================
# CREDENTIALS
# Set one of:
#   (a) credentials.private-key directly (not recommended for production)
#   (b) secret.key.file / funder.wallet.file pointing to external files
# ==============================================================================
# credentials.private-key=0x...
# credentials.funder-wallet=0x...
