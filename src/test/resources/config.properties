# Test configuration for ConfigTest
# These values are used for unit testing the Config class

# Core Strategy Parameters
max.total.cost=0.95
min.total.cost=0.90
min.profit.threshold=0.01
max.budget=10.0
use.dynamic.min.size=true
fixed.trade.size=1.0

# Momentum-First Strategy
enable.momentum.first=true
momentum.threshold=0.50
momentum.min.profit.threshold=0.005
place.passive.hedge.order=true
hedge.post.only=true
hedge.reprice.interval=2.0

# Timing
poll.interval=0.01
max.leg2.wait.time=30
rescan.interval=5

# Market Selection
market.keywords=XRP
max.hours.until.close=1
max.markets.to.scan=100

# Risk Management
dry.run.mode=false
max.concurrent.positions=5
max.consecutive.failures=10
min.account.balance=10.0

# Logging
verbose.logging=true
log.all.price.updates=false
save.trade.history=true
trade.history.file=trade_history.json

# API Configuration
api.host=https://clob.polymarket.com
chain.id=137
secret.key.file=secret-key.txt
funder.wallet.file=funder-wallet.txt

# Performance Tuning
http.connection.pool.size=50
http.connection.timeout=5000
http.read.timeout=10000
http.write.timeout=10000
http.keep.alive.duration=300
thread.pool.size=10
scheduled.pool.size=2

# Advanced Settings
slippage.tolerance=0.01
retry.failed.orders=true
max.order.retries=2
use.market.orders=false
min.liquidity=10.0
default.tick.size=0.01
default.order.type=FAK
hedge.order.type=GTC
default.fee.rate.bps=100
